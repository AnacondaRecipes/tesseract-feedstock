{% set name = "tesseract" %}
{% set version = "5.5.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://github.com/tesseract-ocr/{{ name }}/archive/{{ version }}.tar.gz
    sha256: 6235ea0dae45ea137f59c09320406f5888383741924d98855bd2ce0d16b54f21
    folder: tesseract
  - url: https://github.com/tesseract-ocr/tessdata_fast/archive/4.1.0.tar.gz
    sha256: d0e3bb6f3b4e75748680524a1d116f2bfb145618f8ceed55b279d15098a530f9
    folder: tessdata_fast

build:
  number: 0
  # Windows support not yet implemented. Upstream dropped the SW dependency in 5.5.x
  # and now builds with cmake+Ninja+MSVC (SW_BUILD=OFF). Windows is feasible but
  # requires verifying all deps are available in the channel. Tracked as a follow-up.
  skip: true  # [win]
  run_exports:
    - {{ pin_subpackage(name, max_pin='x.x.x') }}

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}  # upstream builds with GCC 14 on Ubuntu 24.04 as of 5.5.2
    - autoconf  # [not win]
    - automake  # [not win]
    - cmake >=3.30  # [win]  # upstream bumped cmake requirement in 5.3+
    - libtool  # [not win]
    # make is needed for bootstrapping makefile fragments for automatic dependency tracking
    - make  # [not win]
    - pkg-config
  host:
    - leptonica 1.82.0
    - libarchive 3.8
  run:
    - _openmp_mutex  # [linux]

test:
  files:
    - eurotext.tif
    - eurotext.expected.txt
  commands:
    - tesseract -v
    - tesseract --help
    - tesseract --list-langs
    # Smoke test: eng-only OCR, just verify the binary runs end-to-end.
    - tesseract eurotext.tif outputbase -l eng
    - cat outputbase.txt
    # Regression test: multi-language OCR against a captured baseline.
    # eurotext.expected.txt was captured from the 5.5.2 build using the
    # same -l flag. Tesseract is deterministic for a given binary +
    # tessdata + flags, so any drift here means something changed in the
    # build. If a future bump trips this, investigate before merging:
    # if OCR genuinely got better, update eurotext.expected.txt and
    # note it in the PR.
    - tesseract eurotext.tif outputbase-multi -l eng+deu+fra+ita+spa+por
    - diff -u eurotext.expected.txt outputbase-multi.txt

about:
  home: https://github.com/tesseract-ocr/tesseract
  license: Apache-2.0
  license_family: Apache
  license_file: tesseract/LICENSE
  summary: An optical character recognition (OCR) engine
  description: |
    Tesseract is an OCR engine with support for unicode and the ability
    to recognize more than 100 languages out of the box. It can be
    trained to recognize other languages.
  doc_url: https://tesseract-ocr.github.io/tessdoc/
  dev_url: https://github.com/tesseract-ocr/tesseract

extra:
  recipe-maintainers:
    - mxr-conda
    - CurtLH
    - carlodri
    - oblute
    - izahn
